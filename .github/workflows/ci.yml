name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # 8.4 reports but does not gate: it is tested because composer.json claims
    # >=8.1, but its new deprecations should surface as information rather than
    # block a merge until the codebase is deliberately verified against it.
    continue-on-error: ${{ matrix.php == '8.4' }}

    strategy:
      # Report every PHP version's result, not just the first failure.
      fail-fast: false
      matrix:
        # composer.json declares php >=8.1, so every version it claims to
        # support is tested. If 8.1 fails, the constraint is wrong, not the CI.
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Neither tool needs a database: phpstan.neon bootstraps only the
      # autoloader, and tests/bootstrap.php does the same.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --display-all-issues
