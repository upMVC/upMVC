name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # composer.json declares php >=8.1 for the runtime, but PHPUnit 11 requires
  # php >=8.2, so dev dependencies cannot install on 8.1 at all. The runtime
  # claim is verified separately by the php81-runtime job below.
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # 8.4 reports but does not gate: its new deprecations should surface as
    # information rather than block a merge until the codebase is deliberately
    # verified against it.
    continue-on-error: ${{ matrix.php == '8.4' }}

    strategy:
      # Report every PHP version's result, not just the first failure.
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Neither tool needs a database: phpstan.neon bootstraps only the
      # autoloader, and tests/bootstrap.php does the same.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --display-all-issues

  # Verifies the `php >=8.1` constraint in composer.json without dev
  # dependencies, which cannot install there. If this fails, the constraint is
  # wrong and should be raised to >=8.2.
  php81-runtime:
    name: PHP 8.1 runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install runtime dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Syntax check every source file
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Boot the kernel
        run: |
          php -r '
            define("UPMVC_APP_ROOT", __DIR__);
            require "vendor/autoload.php";
            $app = App\Etc\Application::getInstance();
            if (!$app instanceof App\Etc\Application) { exit(1); }
            if (!class_exists("App\Etc\Router")) { exit(1); }
            echo "kernel boots on PHP " . PHP_VERSION . PHP_EOL;
          '
